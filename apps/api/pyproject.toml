[project]
name = "cloudops-api"
version = "0.4.0"
description = "CloudOps Platform API. AWS AMER, EMEA, and APAC use live adapters when scanned; Alibaba stays mocked."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "celery[redis]>=5.4.0",
  "kubernetes>=31.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
