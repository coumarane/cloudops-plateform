[project]
name = "cloudops-api"
version = "0.10.0"
description = "CloudOps Platform API. Certificate monitoring and credential metadata in PostgreSQL; secret material stays in a secret backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "celery[redis]>=5.4.0",
  "kubernetes>=31.0.0",
  "alibabacloud-tea-openapi>=0.3.0",
  "alibabacloud-credentials>=0.3.0",
  "alibabacloud-cs20151215>=4.0.0",
  "alibabacloud-sts20150401>=1.1.0",
  "alibabacloud-cas20200407>=2.0.0",
  "alibabacloud-kms20160120>=2.0.0",
  "cryptography>=43.0.0",
  "PyNaCl>=1.5.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
